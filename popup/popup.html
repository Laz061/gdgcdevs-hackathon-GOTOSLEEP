<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sleep Timer</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="container">
    <h1>Go.To.Sleep</h1>
    <label for="sleepTime">Go to sleep at:</label>
    <input type="time" id="sleepTime" />
    <button id="startBtn" class="button-29">Start Countdown</button>
    <button id="resetBtn" class="button-29 hidden">Reset</button>

    <div id="countdown" class="hidden">
      <div class="countdown-container">
        <div class="countdown-segment">
          <span id="hours" class="countdown-value">00</span>
          <span class="countdown-label">HRS</span>
        </div>
        <div class="countdown-segment">
          <span id="minutes" class="countdown-value">00</span>
          <span class="countdown-label">MIN</span>
        </div>
        <div class="countdown-segment">
          <span id="seconds" class="countdown-value">00</span>
          <span class="countdown-label">SEC</span>
        </div>
      </div>
    </div>

    <div class="progress-bar hidden">
      <div id="progress"></div>
    </div>

    <div id="message" class="hidden">
      <p>⏰ Go to sleep!</p>
    </div>

    <div class="toggle">
      <div id="devMode" class="hidden">
        <button id="trigger1">30 Mins</button>
        <button id="trigger2">20 Mins</button>
        <button id="trigger3">10 Mins</button>
        <button id="trigger4">Bed Time</button>
      </div>

      
        <label>
          <input type="checkbox" id="devToggle"> Dev Mode
        </label>
    </div>

  <script src="popup.js"></script>
</body>
</html>
